<app-aside-nav></app-aside-nav>
<main class="admin-dashboard">
  <div class="dashboard-content">
    <header class="dashboard-header">
      <p class="eyebrow">Panel administrador</p>
      <h1>Dashboard</h1>
      <p>Administrá la comunidad y consultá su actividad.</p>
    </header>

    <nav class="tabs" aria-label="Secciones del dashboard">
      <button
        type="button"
        [class.active]="activeTab === 'users'"
        [attr.aria-current]="activeTab === 'users' ? 'page' : null"
        (click)="selectTab('users')"
      >
        Usuarios
      </button>
      <button
        type="button"
        [class.active]="activeTab === 'statistics'"
        [attr.aria-current]="activeTab === 'statistics' ? 'page' : null"
        (click)="selectTab('statistics')"
      >
        Estadísticas
      </button>
    </nav>

    @if (activeTab === 'users') {
      <app-users-tab />
    }
    @if (statisticsOpened) {
      <div [hidden]="activeTab !== 'statistics'">
        <app-statistics-panel />
      </div>
    }
  </div>
</main>
