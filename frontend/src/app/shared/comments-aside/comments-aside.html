<div class="comments-overlay">
  <button
    class="comments-backdrop"
    type="button"
    aria-label="Cerrar comentarios"
    (click)="close()"
  ></button>

  <aside class="comments-panel" role="dialog" aria-modal="true" aria-labelledby="comments-title">
    <header class="comments-header">
      <div>
        <p class="eyebrow">Comentarios</p>
        <h2 id="comments-title">{{ post.titulo }}</h2>
      </div>
      <button class="close-button" type="button" aria-label="Cerrar comentarios" (click)="close()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
    </header>

    <div class="comments-empty" aria-live="polite">
      <span class="comments-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6a7.5 7.5 0 1 1 17-3.5Z" />
          <path d="M8 11h.01M12 11h.01M16 11h.01" />
        </svg>
      </span>
      <h3>Los comentarios aparecerán aquí</h3>
    </div>
  </aside>
</div>
